# Local development helper — runs Redis + Postgres in containers.
# Frontend + backend run on the host via `pnpm dev`.
#   docker compose -f docker-compose.dev.yml up -d
# Then point the server at Postgres and apply migrations:
#   DATABASE_URL=postgres://tuan:tuan@localhost:5432/tuan_tanah pnpm --filter server migrate
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  postgres:
    # Major version tracks the shared platform Postgres on the VPS (pinned to
    # pgvector/pgvector:pg18 there) so dev and prod can't silently test different
    # engines. Plain image — this project doesn't use pgvector.
    # A major bump needs a volume reset: `docker compose -f docker-compose.dev.yml down -v`
    # (the local archive is throwaway data).
    image: postgres:18-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=tuan
      - POSTGRES_PASSWORD=tuan
      - POSTGRES_DB=tuan_tanah
    volumes:
      # PG18 moved PGDATA from /var/lib/postgresql/data to /var/lib/postgresql/18/docker
      # (major-version subdirectories, so `pg_upgrade --link` never crosses a mount
      # boundary). Mounting the old path on pg18 makes this an unused mount and the
      # image refuses to start. Mount the PARENT — docker-library/postgres#1259.
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tuan -d tuan_tanah']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_dev_data:
  postgres_dev_data:
