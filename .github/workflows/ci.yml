name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate as local dev: typecheck + eslint + prettier --check.
      - run: pnpm check

      # Engine tests (server) then client tests. Neither needs Postgres or Redis —
      # the engine is pure and the store falls back to in-memory.
      - run: pnpm test

      # Catches Vite/bundler breakage that tsc alone misses, before it fails on the VPS.
      - run: pnpm build
