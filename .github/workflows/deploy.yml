# Manual deploy to the VPS. Intentionally workflow_dispatch-only for now: the
# shared platform Postgres (Katzelabs/platform) has to be provisioned on the box before the
# first run, and auto-deploying on push to main is a decision to make separately.
#
# Required repository secrets:
#   VPS_HOST      hostname or IP
#   VPS_USER      ssh user (must be in the `docker` group)
#   VPS_SSH_KEY   private key, PEM format, no passphrase
#   VPS_APP_DIR   absolute path to the checked-out repo on the VPS
# Optional:
#   VPS_PORT      ssh port (default 22)
#
# The VPS builds the images itself (`make deploy` = git pull + compose build).
# If the client build starts starving a small box, switch to building images here
# and pushing to GHCR, then have the VPS pull instead of build.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: make deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail && cd '$VPS_APP_DIR' && make deploy"

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && set -a && . ./.env && set +a && make health"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
