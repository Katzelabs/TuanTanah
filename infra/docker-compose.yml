# Platform stack — shared data tier for every project on this VPS.
#
# Owns a single Postgres instance that app stacks connect to over the external
# `platform` Docker network. Each project gets its OWN database + login role
# (see scripts/provision-db.sh) — never a shared database, because migration
# tables (`kysely_migration`) and generic table names collide across tenants.
#
#   docker network create platform     # once, before the first `up`
#   cp .env.example .env && edit       # set POSTGRES_SUPERUSER_PASSWORD
#   docker compose up -d
#
# Redis is deliberately NOT here: it holds live game state (hot path), it costs
# ~5MB idle, and a flush would drop in-flight games. Each app stack runs its own.

services:
  postgres:
    # pgvector/pgvector ships stock Postgres plus the `vector` extension. The shared
    # instance must satisfy the most demanding tenant: konku needs pg17 + pgvector,
    # Tuan Tanah's archive is version-agnostic. One image variable feeds both
    # services so the pg_dumpall client can never drift from the server version.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in infra/.env}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback ONLY — for psql/pg_dump from the machine's shell. App stacks reach
      # Postgres over the `platform` network, not through this mapping. Never widen
      # the bind address to 0.0.0.0. The host port is configurable because another
      # project's dev stack may already hold 5432.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - platform
    restart: unless-stopped

  # Nightly `pg_dumpall` into ./backups, pruned by retention. Runs as a loop in a
  # container rather than host cron so the whole data tier is one `docker compose up`.
  postgres-backup:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in infra/.env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/backup.sh']
    networks:
      - platform
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  # Created out-of-band (`docker network create platform`) so app stacks in other
  # directories can join it without depending on this stack's lifecycle.
  platform:
    external: true
    name: platform
